name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ed4u
          POSTGRES_USER: ed4u
          POSTGRES_PASSWORD: ed4u_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ed4u -d ed4u"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ed4u:ed4u_local@127.0.0.1:5432/ed4u
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
