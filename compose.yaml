name: ed4u

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ed4u
      POSTGRES_USER: ed4u
      POSTGRES_PASSWORD: ed4u_local
    ports:
      - "5434:5432"
    volumes:
      - ed4u-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ed4u -d ed4u"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ed4u-postgres-data:
